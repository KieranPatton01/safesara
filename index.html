<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="main-container">
    <div class="content-wrapper glass-panel">
      <!-- Animated Spain SVG Illustration -->
      <div class="illustration-container">
        <svg class="spain-illustration" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Spain Flag Gradients -->
            <linearGradient id="spainFlagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#AA151B"/>
              <stop offset="22%" stop-color="#AA151B"/>
              <stop offset="25%" stop-color="#F1BF00"/>
              <stop offset="75%" stop-color="#F1BF00"/>
              <stop offset="78%" stop-color="#AA151B"/>
              <stop offset="100%" stop-color="#AA151B"/>
            </linearGradient>

            <linearGradient id="waveGlow" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF7E5F">
                <animate attributeName="stop-color" values="#FF7E5F;#FEB47B;#FF7E5F" dur="4s" repeatCount="indefinite" />
              </stop>
              <stop offset="50%" stop-color="#FEB47B">
                <animate attributeName="stop-color" values="#FEB47B;#FF1361;#FEB47B" dur="4s" repeatCount="indefinite" />
              </stop>
              <stop offset="100%" stop-color="#FFF176">
                <animate attributeName="stop-color" values="#FFF176;#FF7E5F;#FFF176" dur="4s" repeatCount="indefinite" />
              </stop>
            </linearGradient>

            <filter id="spainGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#F1BF00" flood-opacity="0.35"/>
              <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#AA151B" flood-opacity="0.45"/>
            </filter>

            <filter id="pinGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFF" flood-opacity="0.8"/>
            </filter>
          </defs>

          <!-- Ambient Outer Glow Circle -->
          <circle cx="300" cy="250" r="210" fill="url(#spainFlagGrad)" class="pulse-bg"/>

          <!-- Decorative Animated Grid Rings -->
          <circle cx="300" cy="250" r="230" fill="none" stroke="rgba(241, 191, 0, 0.25)" stroke-width="1.5" stroke-dasharray="8 12" class="spin-ring"/>
          <circle cx="300" cy="250" r="190" fill="none" stroke="rgba(170, 21, 27, 0.3)" stroke-width="1" stroke-dasharray="15 10 5 10" class="spin-ring-reverse"/>

          <!-- Spain Map Silhouette Path with Spain Flag Fill -->
          <g filter="url(#spainGlow)" class="spain-map-group">
            <!-- Spain Main Outline -->
            <path class="spain-path" d="
              M 115 130
              C 125 110, 160 100, 190 98
              C 215 97, 240 108, 270 102
              C 295 97, 330 92, 355 105
              C 375 115, 395 110, 420 125
              C 435 135, 450 150, 445 170
              C 440 185, 455 200, 465 215
              C 475 230, 480 250, 470 270
              C 460 285, 440 295, 430 310
              C 420 325, 400 340, 385 355
              C 370 370, 345 385, 325 390
              C 310 393, 290 395, 270 390
              C 255 385, 240 375, 225 380
              C 210 385, 200 405, 185 400
              C 175 395, 175 380, 165 375
              C 155 370, 140 375, 130 365
              C 120 355, 130 340, 125 325
              C 120 310, 135 295, 135 280
              C 135 260, 125 240, 130 220
              C 135 200, 120 180, 115 160
              Z
            " fill="url(#spainFlagGrad)" stroke="#FFE066" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Animated Stroke Sweep Effect over Spain Map -->
            <path class="spain-stroke-anim" d="
              M 115 130
              C 125 110, 160 100, 190 98
              C 215 97, 240 108, 270 102
              C 295 97, 330 92, 355 105
              C 375 115, 395 110, 420 125
              C 435 135, 450 150, 445 170
              C 440 185, 455 200, 465 215
              C 475 230, 480 250, 470 270
              C 460 285, 440 295, 430 310
              C 420 325, 400 340, 385 355
              C 370 370, 345 385, 325 390
              C 310 393, 290 395, 270 390
              C 255 385, 240 375, 225 380
              C 210 385, 200 405, 185 400
              C 175 395, 175 380, 165 375
              C 155 370, 140 375, 130 365
              C 120 355, 130 340, 125 325
              C 120 310, 135 295, 135 280
              C 135 260, 125 240, 130 220
              C 135 200, 120 180, 115 160
              Z
            " fill="none" stroke="url(#waveGlow)" stroke-width="4.5" stroke-linecap="round"/>

            <!-- Balearic Islands (Mallorca, Menorca, Ibiza) -->
            <g class="islands">
              <!-- Mallorca -->
              <ellipse cx="490" cy="270" rx="14" ry="10" fill="url(#spainFlagGrad)" stroke="#FFE066" stroke-width="1.5" transform="rotate(-15 490 270)"/>
              <!-- Menorca -->
              <ellipse cx="520" cy="250" rx="8" ry="5" fill="url(#spainFlagGrad)" stroke="#FFE066" stroke-width="1.5" transform="rotate(-20 520 250)"/>
              <!-- Ibiza -->
              <ellipse cx="460" cy="295" rx="7" ry="5" fill="url(#spainFlagGrad)" stroke="#FFE066" stroke-width="1.5" transform="rotate(-10 460 295)"/>
            </g>

            <!-- Canary Islands Inset / Accents -->
            <g class="canary-islands" transform="translate(60, 415)">
              <rect x="0" y="0" width="115" height="42" rx="8" fill="rgba(9, 7, 20, 0.7)" stroke="rgba(241, 191, 0, 0.4)" stroke-width="1"/>
              <text x="10" y="14" font-size="7.5" fill="#F1BF00" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" letter-spacing="0.5">ISLAS CANARIAS</text>
              <ellipse cx="20" cy="28" rx="6" ry="4" fill="#F1BF00"/>
              <ellipse cx="38" cy="26" rx="8" ry="4" fill="#AA151B"/>
              <ellipse cx="60" cy="28" rx="10" ry="5" fill="#F1BF00"/>
              <ellipse cx="85" cy="30" rx="7" ry="4" fill="#AA151B"/>
            </g>

            <!-- Animated Location Beacon Pin (Madrid Center) -->
            <g transform="translate(290, 240)" class="location-beacon" filter="url(#pinGlow)">
              <!-- Pulsing Waves -->
              <circle cx="0" cy="0" r="10" fill="none" stroke="#FFF" stroke-width="2" class="beacon-wave-1"/>
              <circle cx="0" cy="0" r="20" fill="none" stroke="#F1BF00" stroke-width="1.5" class="beacon-wave-2"/>
              <!-- Pin Dot -->
              <circle cx="0" cy="0" r="6" fill="#FFF"/>
              <circle cx="0" cy="0" r="3" fill="#AA151B"/>
            </g>

            <!-- Floating Crest / Banner Element -->
            <g transform="translate(300, 160)" class="spain-banner">
              <rect x="-65" y="-15" width="130" height="30" rx="15" fill="rgba(170, 21, 27, 0.9)" stroke="#F1BF00" stroke-width="2"/>
              <text x="0" y="5" font-family="'Cinzel', serif" font-weight="800" font-size="13" fill="#FFF" text-anchor="middle" letter-spacing="2">ESPAÑA</text>
            </g>
          </g>
        </svg>
      </div>

      <!-- Text Content & Cinema Link -->
      <div class="text-container">
        <div class="status-badge">
          <i class="fa-solid fa-person-digging"></i> Under Construction
        </div>

        <h1 class="main-heading">
          looking for your <span class="highlight-text">ragebait</span>?
        </h1>
        <p class="sub-heading">It's a work in progress 😉</p>

        <div class="relocation-box">
          <div class="relocation-icon">
            <i class="fa-solid fa-film"></i>
          </div>
          <div class="relocation-text">
            <h3>Sara Cinema Has Moved!</h3>
            <p>Looking for your favorite movies, audio, and cinema vibes? The theater has been relocated to its dedicated page.</p>
            <a href="cinema/index.html" class="cinema-link-btn">
              <span>Go to Sara Cinema</span>
              <i class="fa-solid fa-arrow-right"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>Built with love &bull; Under Construction</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
