<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f0eb"/>
      <stop offset="100%" stop-color="#e3dac9"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1d17"/>
      <stop offset="100%" stop-color="#1a110d"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c5068"/>
      <stop offset="100%" stop-color="#1f2d3d"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="500" fill="url(#bgGrad)"/>

  <!-- Subtle Studio Backdrop Vignette -->
  <circle cx="200" cy="210" r="170" fill="#ffffff" opacity="0.45"/>

  <!-- Elegant Silhouette / Portrait Figure -->
  <g id="portrait-group" filter="url(#softGlow)">
    <!-- Shoulders / Cozy Jacket -->
    <path d="M 60 500 C 70 420 110 370 145 355 L 200 395 L 255 355 C 290 370 330 420 340 500 Z" fill="url(#coatGrad)"/>
    
    <!-- Scarf / Turtleneck Accent -->
    <path d="M 155 355 C 170 375 230 375 245 355 L 235 320 C 210 330 190 330 165 320 Z" fill="#c25953"/>
    <path d="M 160 330 C 180 340 220 340 240 330 L 230 365 C 210 370 190 370 170 365 Z" fill="#a8433e" opacity="0.8"/>

    <!-- Neck -->
    <rect x="178" y="270" width="44" height="60" rx="8" fill="#f8d7be"/>

    <!-- Hair Back Volume -->
    <ellipse cx="200" cy="210" rx="88" ry="105" fill="url(#hairGrad)"/>
    <path d="M 115 220 C 105 310 130 370 160 380 C 150 340 145 280 140 240 Z" fill="url(#hairGrad)"/>
    <path d="M 285 220 C 295 310 270 370 240 380 C 250 340 255 280 260 240 Z" fill="url(#hairGrad)"/>

    <!-- Face Shape -->
    <path d="M 148 190 C 148 150 165 130 200 130 C 235 130 252 150 252 190 C 252 240 230 285 200 285 C 170 285 148 240 148 190 Z" fill="#fce4d4"/>

    <!-- Soft Cheeks Glow -->
    <ellipse cx="168" cy="215" rx="14" ry="8" fill="#f59e9e" opacity="0.35"/>
    <ellipse cx="232" cy="215" rx="14" ry="8" fill="#f59e9e" opacity="0.35"/>

    <!-- Eyebrows (Expressive, Intelligent) -->
    <path d="M 164 175 Q 177 170 188 174" fill="none" stroke="#2d1d17" stroke-width="3" stroke-linecap="round"/>
    <path d="M 212 174 Q 223 170 236 175" fill="none" stroke="#2d1d17" stroke-width="3" stroke-linecap="round"/>

    <!-- Warm Eyes with a Knowing Sparkle -->
    <ellipse cx="176" cy="188" rx="8" ry="6" fill="#3b2416"/>
    <circle cx="178" cy="186" r="2.2" fill="#ffffff"/>
    <ellipse cx="224" cy="188" rx="8" ry="6" fill="#3b2416"/>
    <circle cx="226" cy="186" r="2.2" fill="#ffffff"/>

    <!-- Cute Nose Contour -->
    <path d="M 197 190 Q 201 208 203 214 Q 199 217 195 216" fill="none" stroke="#e0b59b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Confident, Slightly Teasing Smile -->
    <path d="M 183 242 Q 200 254 217 242" fill="none" stroke="#b84d5b" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 189 243 Q 200 249 211 243" fill="#ffffff" opacity="0.9"/>

    <!-- Front Hair Tendrils & Styling -->
    <path d="M 130 170 C 135 110 185 105 200 105 C 225 105 270 115 270 175 C 265 145 240 135 220 135 C 190 135 160 145 130 170 Z" fill="url(#hairGrad)"/>
    <path d="M 148 165 C 158 140 185 140 195 160 C 185 150 165 152 148 165 Z" fill="#1a110d" opacity="0.6"/>
    <path d="M 252 165 C 242 140 215 140 205 160 C 215 150 235 152 252 165 Z" fill="#1a110d" opacity="0.6"/>

    <!-- Stylish Little Star Earring -->
    <circle cx="147" cy="216" r="3.5" fill="#f59e0b"/>
    <circle cx="253" cy="216" r="3.5" fill="#f59e0b"/>
  </g>

  <!-- Watermark border corner -->
  <rect x="12" y="12" width="376" height="476" fill="none" stroke="#d5c8b8" stroke-width="1.5" rx="4"/>
  <text x="375" y="475" font-family="-apple-system, sans-serif" font-size="9" fill="#a89a88" text-anchor="end" letter-spacing="0.5px">ARCHIVE S-01 // SARA</text>
</svg>
