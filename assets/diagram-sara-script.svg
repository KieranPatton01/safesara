<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #a2a9b1; stroke-width: 1; }
      .panel-bg { fill: #f8f9fa; stroke: #c8ccd1; stroke-width: 1; }
      .desk { fill: #eaecf0; stroke: #a2a9b1; stroke-width: 1.5; }
      .monitor-frame { fill: #202122; rx: 4; }
      .screen-sara { fill: #e8f0fe; }
      .screen-script { fill: #1e1e2e; }
      .toast { fill: #ffffff; stroke: #dc2626; stroke-width: 1.5; rx: 4; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15)); }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #202122; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #54595d; }
      .text-mono { font-family: Consolas, "Liberation Mono", Courier, monospace; font-size: 10px; fill: #202122; }
      .arrow { stroke: #d33; stroke-width: 2; stroke-dasharray: 4,3; fill: none; marker-end: url(#arrowhead); }
      .flow-box { fill: #ffffff; stroke: #36c; stroke-width: 1.5; rx: 3; }
      .flow-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: bold; fill: #202122; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d33"/>
    </marker>
    <marker id="bluearrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#36c"/>
    </marker>
  </defs>

  <!-- Outer Border / Background -->
  <rect width="760" height="460" fill="#f8f9fa"/>
  <rect x="6" y="6" width="748" height="448" class="bg"/>

  <!-- Diagram Title Header -->
  <rect x="6" y="6" width="748" height="32" fill="#eaecf0" stroke="#a2a9b1" stroke-width="1"/>
  <text x="380" y="27" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#202122" text-anchor="middle">
    Fig 5. Architectural Topology of 'Sara Script 1.0' and the Adjacent Terminal Flaw (2026)
  </text>

  <!-- TOP SECTION: Physical Reception Counter -->
  <!-- Reception Counter Surface -->
  <rect x="25" y="55" width="710" height="235" rx="4" class="panel-bg"/>
  <text x="40" y="75" class="text-title" fill="#72777d">PHYSICAL RECEPTION COUNTER TOPOLOGY (SAFESTAY EDINBURGH)</text>

  <!-- WORKSTATION A: Sara's Terminal -->
  <g transform="translate(45, 90)">
    <rect width="260" height="185" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="24" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
    <text x="130" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1b5e20" text-anchor="middle">
      TERMINAL A: SARA'S WORKSTATION
    </text>

    <!-- Monitor Graphic -->
    <rect x="55" y="35" width="150" height="90" rx="3" fill="#202122"/>
    <rect x="60" y="40" width="140" height="80" rx="2" fill="#e8f0fe"/>
    <rect x="120" y="125" width="20" height="15" fill="#54595d"/>
    <rect x="105" y="140" width="50" height="5" rx="2" fill="#72777d"/>

    <text x="130" y="65" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1a73e8" text-anchor="middle">PMS / KEYCARD SYSTEM</text>
    <text x="130" y="80" font-family="sans-serif" font-size="8" fill="#54595d" text-anchor="middle">Sara on shift (Operating normally)</text>
    <text x="130" y="95" font-family="sans-serif" font-size="8" fill="#2e7d32" text-anchor="middle">[Status: Flawless aesthetic composure]</text>

    <rect x="15" y="152" width="230" height="22" rx="3" fill="#f1f8e9" stroke="#81c784" stroke-width="1"/>
    <text x="130" y="167" font-family="sans-serif" font-size="9" fill="#2e7d32" text-anchor="middle">
      Sara Script: NOT INSTALLED (Oblivious)
    </text>
  </g>

  <!-- THE 1.2 METRE DISPLACEMENT VOID -->
  <g transform="translate(315, 90)">
    <line x1="10" y1="90" x2="120" y2="90" class="arrow"/>
    <line x1="120" y1="90" x2="10" y2="90" class="arrow"/>
    <rect x="15" y="70" width="100" height="38" rx="3" fill="#fff8e1" stroke="#f59e0b" stroke-width="1"/>
    <text x="65" y="84" font-family="sans-serif" font-size="9" font-weight="bold" fill="#b45309" text-anchor="middle">1.2m Physical Gap</text>
    <text x="65" y="98" font-family="sans-serif" font-size="7.5" fill="#78350f" text-anchor="middle">Intended Target Void</text>

    <rect x="8" y="125" width="114" height="42" rx="2" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="65" y="138" font-family="sans-serif" font-size="8" font-weight="bold" fill="#b91c1c" text-anchor="middle">ROUTING FAILURE</text>
    <text x="65" y="150" font-family="sans-serif" font-size="7" fill="#7f1d1d" text-anchor="middle">Love notes cannot leap</text>
    <text x="65" y="160" font-family="sans-serif" font-size="7" fill="#7f1d1d" text-anchor="middle">physical counter space</text>
  </g>

  <!-- WORKSTATION B: The Adjacent Terminal (Actual Installed Machine) -->
  <g transform="translate(455, 90)">
    <rect width="260" height="185" rx="4" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="24" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="1"/>
    <text x="130" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c62828" text-anchor="middle">
      TERMINAL B: ADJACENT WORKSTATION
    </text>

    <!-- Monitor Graphic with Toast -->
    <rect x="35" y="32" width="190" height="100" rx="3" fill="#202122"/>
    <rect x="40" y="37" width="180" height="90" rx="2" fill="#2b2d42"/>
    <rect x="120" y="132" width="20" height="12" fill="#54595d"/>
    <rect x="105" y="144" width="50" height="5" rx="2" fill="#72777d"/>

    <!-- WinRT Toast Notification Popup on Terminal B -->
    <rect x="50" y="45" width="160" height="74" rx="3" fill="#ffffff" stroke="#e11d48" stroke-width="1.2"/>
    <rect x="50" y="45" width="160" height="16" fill="#ffe4e6"/>
    <text x="56" y="56" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#9f1239">SafestayShiftReminder [URGENT]</text>
    <text x="56" y="72" font-family="sans-serif" font-size="8" font-weight="bold" fill="#111827">Sara youre so fine</text>
    <text x="56" y="84" font-family="sans-serif" font-size="7.5" fill="#374151">"Iwish u was mine?"</text>
    <text x="56" y="96" font-family="sans-serif" font-size="7" fill="#6b7280">[Audio: Looping.Alarm]</text>
    <text x="56" y="107" font-family="sans-serif" font-size="7" fill="#dc2626">Audience: Stunned coworker</text>

    <rect x="15" y="152" width="230" height="22" rx="3" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
    <text x="130" y="167" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#be123c" text-anchor="middle">
      Sara Script: 100% ACTIVE (Wrong Screen)
    </text>
  </g>

  <!-- BOTTOM SECTION: Software Execution Architecture -->
  <rect x="25" y="305" width="710" height="140" rx="4" class="panel-bg"/>
  <text x="40" y="325" class="text-title" fill="#72777d">SARA SCRIPT 1.0 SYSTEM ARCHITECTURE &amp; DISPATCH PIPELINE</text>

  <!-- Flow 1: Setup.bat & Manage-Schedule.ps1 -->
  <g transform="translate(45, 340)">
    <rect width="135" height="55" class="flow-box"/>
    <text x="67" y="358" class="flow-text">1. Setup.bat &amp;</text>
    <text x="67" y="372" class="flow-text">Manage-Schedule.ps1</text>
    <text x="67" y="385" font-family="monospace" font-size="8" fill="#54595d" text-anchor="middle">HKCU AUMID Registration</text>
  </g>

  <line x1="180" y1="367" x2="210" y2="367" stroke="#36c" stroke-width="1.5" marker-end="url(#bluearrow)"/>

  <!-- Flow 2: messages.json -->
  <g transform="translate(215, 340)">
    <rect width="125" height="55" class="flow-box"/>
    <text x="62" y="358" class="flow-text">2. messages.json</text>
    <text x="62" y="372" font-family="monospace" font-size="8.5" fill="#b91c1c" text-anchor="middle">{"Title": "POOPBEDS..."}</text>
    <text x="62" y="385" font-family="monospace" font-size="8" fill="#54595d" text-anchor="middle">Self-Destructing Queue</text>
  </g>

  <line x1="340" y1="367" x2="370" y2="367" stroke="#36c" stroke-width="1.5" marker-end="url(#bluearrow)"/>

  <!-- Flow 3: Task Scheduler -->
  <g transform="translate(375, 340)">
    <rect width="145" height="55" class="flow-box"/>
    <text x="72" y="358" class="flow-text">3. Windows Task</text>
    <text x="72" y="372" class="flow-text">'WorkdayGreeting'</text>
    <text x="72" y="385" font-family="monospace" font-size="8" fill="#54595d" text-anchor="middle">Time-Triggered Daemon</text>
  </g>

  <line x1="520" y1="367" x2="550" y2="367" stroke="#36c" stroke-width="1.5" marker-end="url(#bluearrow)"/>

  <!-- Flow 4: Show-Notification.ps1 -->
  <g transform="translate(555, 340)">
    <rect width="165" height="55" class="flow-box"/>
    <text x="82" y="356" class="flow-text">4. Show-Notification.ps1</text>
    <text x="82" y="369" font-family="sans-serif" font-size="8" fill="#202122" text-anchor="middle">1. WinRT Custom Toast</text>
    <text x="82" y="380" font-family="sans-serif" font-size="8" fill="#54595d" text-anchor="middle">2. WinForms Balloon Fallback</text>
    <text x="82" y="391" font-family="sans-serif" font-size="8" fill="#54595d" text-anchor="middle">3. WScript.Shell Native Popup</text>
  </g>

  <!-- Legend text at bottom -->
  <text x="380" y="430" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#54595d" text-anchor="middle">
    Conclusion: While technically sophisticated, 100% of romantic shift notifications failed to reach Sara due to installation on the adjacent terminal.
  </text>
</svg>
