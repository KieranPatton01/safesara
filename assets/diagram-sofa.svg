<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <rect width="320" height="200" fill="#f8f9fa"/>
  <rect x="5" y="5" width="310" height="190" fill="#ffffff" stroke="#c8ccd1" stroke-width="1"/>

  <!-- Sofa Base -->
  <rect x="40" y="50" width="240" height="100" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <!-- Sofa Backrest -->
  <rect x="40" y="30" width="240" height="30" rx="6" fill="#ced4da" stroke="#495057" stroke-width="2"/>
  <!-- Armrests -->
  <rect x="30" y="45" width="22" height="105" rx="5" fill="#ced4da" stroke="#495057" stroke-width="2"/>
  <rect x="268" y="45" width="22" height="105" rx="5" fill="#ced4da" stroke="#495057" stroke-width="2"/>

  <!-- Territorial Shading: 92% Claimed by Sara -->
  <rect x="55" y="60" width="195" height="80" rx="4" fill="#fecdd3" fill-opacity="0.75" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="152" y="105" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#be123c" text-anchor="middle">Sara's Blanket Zone (92%)</text>

  <!-- Remaining 8% for Kieran / General Public -->
  <rect x="252" y="60" width="16" height="80" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="260" y="105" font-family="-apple-system, sans-serif" font-size="8" fill="#64748b" text-anchor="middle" transform="rotate(-90 260 105)">8% Edge</text>

  <!-- Technical Annotations -->
  <line x1="55" y1="155" x2="250" y2="155" stroke="#be123c" stroke-width="1.5"/>
  <circle cx="55" cy="155" r="3" fill="#be123c"/>
  <circle cx="250" cy="155" r="3" fill="#be123c"/>
  <text x="152" y="172" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#54595d" text-anchor="middle">Demarcation Line (Treaty of the Living Room, 2024)</text>
</svg>
