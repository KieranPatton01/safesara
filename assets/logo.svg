<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" fill="none">
  <!-- Stylized Puzzle Globe / Wiki Crest -->
  <g transform="translate(4, 4)">
    <!-- Globe Base Circle -->
    <circle cx="24" cy="24" r="23" fill="url(#globeGrad)" stroke="#a2a9b1" stroke-width="1.3"/>
    <!-- Latitude / Longitude Curvature Lines -->
    <ellipse cx="24" cy="24" rx="23" ry="9.5" stroke="#ffffff" stroke-width="0.9" opacity="0.65"/>
    <ellipse cx="24" cy="24" rx="10.5" ry="23" stroke="#ffffff" stroke-width="0.9" opacity="0.65"/>
    <line x1="1" y1="24" x2="47" y2="24" stroke="#ffffff" stroke-width="0.9" opacity="0.65"/>
    <line x1="24" y1="1" x2="24" y2="47" stroke="#ffffff" stroke-width="0.9" opacity="0.65"/>
    
    <!-- Puzzle Piece Stylings -->
    <path d="M 13 13 Q 19 11 24 13 Q 26 17 30 15 Q 35 22 35 28" fill="none" stroke="#72777d" stroke-width="1.3" opacity="0.85"/>
    <path d="M 13 35 Q 19 37 24 35 Q 26 31 30 33 Q 35 26 35 20" fill="none" stroke="#72777d" stroke-width="1.3" opacity="0.85"/>
    
    <!-- Central Encyclopedic 'S' Emblem -->
    <text x="24" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" fill="#202122" text-anchor="middle" filter="url(#dropShadow)">S</text>
  </g>

  <!-- Wordmark: High Legibility Vector 2022 Typography -->
  <text x="62" y="31" font-family="'Linux Libertine', Georgia, 'Times New Roman', serif" font-size="27" font-weight="600" fill="#202122" letter-spacing="-0.4px">Sara<tspan font-weight="bold">Wiki</tspan></text>
  <text x="63" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" font-style="italic" fill="#54595d" letter-spacing="0.4px">The Free Encyclopedia</text>

  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f3f6"/>
      <stop offset="100%" stop-color="#dce1e7"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="0.5" flood-color="#ffffff"/>
    </filter>
  </defs>
</svg>
